<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Karar Mercii — Yönetim</title>
    <style>
      :root {
        --ac: #7c3aed;
        --ac-d: #5b21b6;
        --ac-dd: #4c1d95;
        --bg: #f6f5fb;
        --card: #ffffff;
        --txt: #1a1a2e;
        --mut: #6b7280;
        --bd: #e7e4f5;
        --red: #dc2626;
        --red-bg: #fef2f2;
        --green: #16a34a;
        --amber: #d97706;
        --amber-bg: #fffbeb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14121c;
          --card: #1e1b2b;
          --txt: #ece9f5;
          --mut: #9b95b3;
          --bd: #322c46;
          --red-bg: #2a1518;
          --amber-bg: #2a2412;
        }
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--txt);
        font-weight: 700;
        line-height: 1.5;
      }
      /* ── Login gate ── */
      .gate {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 28px;
        gap: 16px;
      }
      .gate h1 {
        font-size: 24px;
        color: var(--ac-dd);
        margin: 0;
      }
      .gate .sub {
        color: var(--mut);
        max-width: 420px;
        font-size: 14px;
      }
      .btn {
        border: none;
        border-radius: 14px;
        padding: 14px 26px;
        font-size: 15px;
        font-weight: 900;
        font-family: inherit;
        cursor: pointer;
        background: var(--ac);
        color: #fff;
        box-shadow: 0 8px 22px rgba(124, 58, 237, 0.3);
      }
      .btn.ghost {
        background: transparent;
        color: var(--ac);
        box-shadow: none;
        border: 1.5px solid var(--bd);
      }
      .btn.sm {
        padding: 7px 14px;
        font-size: 13px;
        border-radius: 10px;
      }
      .btn.danger {
        background: var(--red);
        box-shadow: none;
      }
      .uidbox {
        font-family: ui-monospace, "Cascadia Code", monospace;
        background: var(--card);
        border: 1.5px dashed var(--ac);
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 13px;
        word-break: break-all;
        max-width: 460px;
        user-select: all;
      }
      .banner {
        background: var(--amber-bg);
        border: 1.5px solid var(--amber);
        color: var(--amber);
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 13.5px;
        max-width: 640px;
      }
      /* ── App shell ── */
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--card);
        border-bottom: 1.5px solid var(--bd);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .top .brand {
        font-size: 17px;
        font-weight: 900;
        color: var(--ac-dd);
      }
      .top .who {
        color: var(--mut);
        font-size: 12px;
        margin-left: auto;
      }
      .tabs {
        display: flex;
        gap: 6px;
        padding: 12px 12px 0;
        overflow-x: auto;
        position: sticky;
        top: 49px;
        background: var(--bg);
        z-index: 4;
      }
      .tab {
        white-space: nowrap;
        border: none;
        background: transparent;
        color: var(--mut);
        font-family: inherit;
        font-weight: 800;
        font-size: 14px;
        padding: 9px 14px;
        border-radius: 12px 12px 0 0;
        cursor: pointer;
      }
      .tab.on {
        background: var(--card);
        color: var(--ac-dd);
        border: 1.5px solid var(--bd);
        border-bottom: none;
      }
      .tab .cnt {
        display: inline-block;
        min-width: 18px;
        font-size: 11px;
        background: var(--ac);
        color: #fff;
        border-radius: 9px;
        padding: 0 5px;
        margin-left: 4px;
      }
      .wrap {
        padding: 14px 12px 60px;
        max-width: 900px;
        margin: 0 auto;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .card {
        background: var(--card);
        border: 1.5px solid var(--bd);
        border-radius: 14px;
        padding: 13px 15px;
        margin-bottom: 10px;
      }
      .card .meta {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--mut);
        margin-bottom: 6px;
      }
      .card .body {
        font-size: 14.5px;
        color: var(--txt);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .pill {
        font-size: 11px;
        font-weight: 900;
        padding: 2px 9px;
        border-radius: 20px;
        background: var(--ac);
        color: #fff;
      }
      .pill.gray {
        background: var(--bd);
        color: var(--mut);
      }
      .pill.red {
        background: var(--red);
      }
      .pill.green {
        background: var(--green);
      }
      .pill.amber {
        background: var(--amber);
      }
      .quote {
        border-left: 3px solid var(--bd);
        padding-left: 10px;
        color: var(--mut);
        font-size: 13px;
        margin-top: 6px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .empty,
      .err {
        text-align: center;
        color: var(--mut);
        padding: 40px 20px;
        font-size: 14px;
      }
      .err {
        color: var(--red);
      }
      a {
        color: var(--ac);
      }
      .stars {
        color: #f59e0b;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <!-- ══ LOGIN / GATE ══ -->
    <div class="gate" id="gate">
      <h1>🐙 Karar Mercii — Yönetim</h1>
      <div class="sub" id="gate-sub">
        Yönetim paneline erişmek için yetkili Google hesabınla giriş yap.
      </div>
      <button class="btn" id="login-btn">Google ile Giriş Yap</button>
      <div id="gate-extra"></div>
    </div>

    <!-- ══ APP ══ -->
    <div id="app" style="display: none">
      <div class="top">
        <span class="brand">🐙 Yönetim</span>
        <span class="who" id="who"></span>
        <button class="btn ghost sm" id="logout-btn">Çıkış</button>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="ozet">📈 Özet</button>
        <button class="tab" data-tab="kullanici">🔍 Kullanıcı</button>
        <button class="tab" data-tab="ulasin">📮 Bize Ulaşın<span class="cnt" id="cnt-ulasin">·</span></button>
        <button class="tab" data-tab="puan">⭐ Puanlama<span class="cnt" id="cnt-puan">·</span></button>
        <button class="tab" data-tab="duyuru">📣 Duyuru</button>
        <button class="tab" data-tab="merci">🤖 Merci AI<span class="cnt" id="cnt-merci">·</span></button>
        <button class="tab" data-tab="kota">📊 AI Kota<span class="cnt" id="cnt-kota">·</span></button>
        <button class="tab" data-tab="oda">🚪 Odalar<span class="cnt" id="cnt-oda">·</span></button>
        <button class="tab" data-tab="push">📢 Bildirim<span class="cnt" id="cnt-push">·</span></button>
        <button class="tab" data-tab="saglik">🩺 Sağlık<span class="cnt" id="cnt-saglik">·</span></button>
      </div>
      <div class="wrap">
        <div class="row" id="toolbar"></div>
        <div id="list"></div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script>
      // ⚠️ ADMIN UID — kilitlenene kadar boş. Giriş yapınca UID ekranda görünür;
      // onu buraya (ve firestore.rules'a) yazınca panel kilitlenir.
      // ⚠️ 16 AĞU — UID DEĞİŞTİ. Eskisi (gq8uRlcr4TOwe41qWnKk18DZ0Wt1) 8 Ağu'da
      // eklenen uygulama içi "Hesabımı Sil" (Apple 5.1.1(v)) test edilirken
      // silindi; Auth kaydı gidince aynı e-posta (ufukkurucan7@gmail.com) 9
      // Ağu'da YENİ bir UID ile yeniden oluştu. Firebase'de UID hesaba değil
      // KAYDA bağlıdır — silinen kayıt geri gelmez, panel kimseye açılmıyordu.
      // UID değişirse ÜÇ YER birden güncellenmeli: burası + live-server.js
      // (ADMIN_UIDS) + firestore.rules (isAdmin). Biri eksik kalırsa panel açılır
      // ama veri okunamaz, ya da tersi.
      // ⭐ İKİ HESAP birden yetkili (16 Ağu): biri yine silinirse/kaybolursa
      // panel diğeriyle açılabilsin diye. [0] = ufukkurucan7, [1] = asytechstudio
      var ADMIN_UIDS = [
        "r3vZcg4qouP1Kjo1WHjAkZR7eOL2",
        "Zc0eea7rhQMuKK42WaTpNmS9HRi1",
      ];

      firebase.initializeApp({
        apiKey: "AIzaSyBE-mhjBnY1HcIo37FOESGSc3wzzektFdQ",
        authDomain: "karar-mercii.firebaseapp.com",
        projectId: "karar-mercii",
        storageBucket: "karar-mercii.firebasestorage.app",
        messagingSenderId: "624143864166",
        appId: "1:624143864166:web:4953d60b840734153938a7",
      });
      var db = firebase.firestore();
      var auth = firebase.auth();
      var provider = new firebase.auth.GoogleAuthProvider();

      var $ = function (id) { return document.getElementById(id); };
      var esc = function (s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      };
      function fmtTs(ts) {
        var d;
        if (ts == null) return "—";
        if (typeof ts === "number") d = new Date(ts);
        else if (ts.toDate) d = ts.toDate();
        else if (ts.seconds) d = new Date(ts.seconds * 1000);
        else return "—";
        return d.toLocaleString("tr-TR", {
          day: "2-digit", month: "2-digit", year: "2-digit",
          hour: "2-digit", minute: "2-digit",
        });
      }
      function tsVal(ts) {
        if (ts == null) return 0;
        if (typeof ts === "number") return ts;
        if (ts.toDate) return ts.toDate().getTime();
        if (ts.seconds) return ts.seconds * 1000;
        return 0;
      }

      $("login-btn").onclick = function () {
        auth.signInWithPopup(provider).catch(function (e) {
          $("gate-extra").innerHTML =
            '<div class="banner">Giriş hatası: ' + esc(e.message) + "</div>";
        });
      };
      $("logout-btn").onclick = function () { auth.signOut(); };

      auth.onAuthStateChanged(function (user) {
        if (!user) {
          $("app").style.display = "none";
          $("gate").style.display = "flex";
          $("gate-extra").innerHTML = "";
          return;
        }
        var locked =
          ADMIN_UIDS.length > 0 && ADMIN_UIDS[0].indexOf("__") !== 0;
        if (locked && ADMIN_UIDS.indexOf(user.uid) === -1) {
          // Yetkisiz hesap
          $("app").style.display = "none";
          $("gate").style.display = "flex";
          $("gate-sub").textContent = "Bu hesap yetkili değil.";
          $("gate-extra").innerHTML =
            '<div class="banner">Bu Google hesabı yönetim yetkisine sahip değil. Doğru hesapla gir.</div>' +
            '<button class="btn ghost sm" onclick="auth.signOut()" style="margin-top:10px">Çıkış yap</button>';
          return;
        }
        // Yetkili (veya henüz kilitlenmemiş kurulum modu)
        $("gate").style.display = "none";
        $("app").style.display = "block";
        $("who").textContent = user.email || user.uid;
        if (!locked) {
          // KURULUM MODU: UID'i göster
          $("toolbar").innerHTML =
            '<div class="banner" style="max-width:100%">🔧 <b>Kurulum modu.</b> Panel henüz kilitli değil. Senin admin UID\'in aşağıda — bunu Claude\'a söyle, kurala + panele gömüp kilitlesin. (Kilitlenene kadar Bize Ulaşın / Puanlama / Merci AI okunamaz — kural okuması kapalı; Odalar çalışır.)<div class="uidbox" style="margin-top:8px">' +
            esc(user.uid) + "</div></div>";
        } else {
          $("toolbar").innerHTML = "";
        }
        refreshBans().then(function () { switchTab(currentTab); });
      });

      // ── Sekmeler ──
      var currentTab = "ozet";
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
        t.onclick = function () {
          Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (x) {
            x.classList.remove("on");
          });
          t.classList.add("on");
          switchTab(t.getAttribute("data-tab"));
        };
      });

      function switchTab(tab) {
        currentTab = tab;
        $("list").innerHTML = '<div class="empty">Yükleniyor…</div>';
        if (tab === "ozet") loadOzet();
        else if (tab === "kullanici") loadKullanici();
        else if (tab === "duyuru") loadDuyuru();
        else if (tab === "ulasin") loadFeedback("contact");
        else if (tab === "puan") loadFeedback("rating");
        else if (tab === "merci") loadMerci();
        else if (tab === "kota") loadUsage();
        else if (tab === "oda") loadRooms();
        else if (tab === "push") loadPush();
        else if (tab === "saglik") loadHealth();
      }

      // ══════════════════════════════════════════════════════════════════════
      // ── 📢 BİLDİRİM SEKMESİ (2 AĞU 2026) ─────────────────────────────────
      // ══════════════════════════════════════════════════════════════════════
      // Bu panel Firestore'a DOĞRUDAN yazmaz; gönderim sunucudaki /admin/push
      // ucundan geçer. Sebep: FCM gönderimi sunucu anahtarı gerektirir ve
      // yetki tek yerde (ADMIN_UIDS) doğrulanır.
      // ⚠️ Zamanlanmış kayıtlar da sunucuya gider — `nextAt`i SUNUCU hesaplar
      // (TR saati → UTC), panelden yanlış değer gelse bile zamanlayıcı tutarlı.
      function _adminHeaders() {
        return auth.currentUser.getIdToken().then(function (t) {
          return { "Content-Type": "application/json", Authorization: "Bearer " + t };
        });
      }
      function _post(url, body) {
        return _adminHeaders().then(function (h) {
          return fetch(url, { method: "POST", headers: h, body: JSON.stringify(body) }).then(
            function (r) {
              return r.json().then(function (j) {
                if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
                return j;
              });
            },
          );
        });
      }

      function _get(url) {
        return _adminHeaders().then(function (h) {
          return fetch(url, { headers: h, cache: "no-store" }).then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
              return j;
            });
          });
        });
      }

      // ══════════════════════════════════════════════════════════════════════
      // 📈 ÖZET — tek bakışta işin durumu
      // ══════════════════════════════════════════════════════════════════════
      // ⚠️⚠️ KOTA: bu sekme Firestore'a HİÇ dokunmaz. Bütün sayılar sunucudaki
      // /admin/stats ucundan geliyor; orada Firestore aggregation (count/sum)
      // kullanılıyor → dokümanlar indirilmiyor, 1000 indeks girişi = 1 okuma.
      // ⛔ Buraya db.collection(...).get() EKLEME. Yeni bir sayı gerekiyorsa
      //    sunucudaki /admin/stats'a aggregation olarak ekle.
      function _kart(baslik, ic) {
        return '<div class="card"><h3 style="margin:0 0 10px">' + baslik + "</h3>" + ic + "</div>";
      }
      function _sayi(v) {
        if (v === null || v === undefined) return '<span style="color:#999">—</span>';
        return "<b>" + v + "</b>";
      }
      function _fark(bugun, dun) {
        if (bugun === null || dun === null || dun === undefined) return "";
        var d = bugun - dun;
        if (d === 0) return ' <span style="color:#888;font-size:12px">= dünle aynı</span>';
        var yukari = d > 0;
        return (
          ' <span style="color:' + (yukari ? "#1a9c5b" : "#c0392b") +
          ';font-size:12px">' + (yukari ? "▲ +" : "▼ ") + d + " (dün " + dun + ")</span>"
        );
      }
      function loadOzet() {
        $("toolbar").innerHTML = "";
        _get("/admin/stats")
          .then(function (s) {
            var k = s.kullanici || {};
            var o = s.oda || {};
            var ai = s.ai || {};
            var m = s.merci || {};
            var toplamOy = (m.begeni || 0) + (m.begenmeme || 0);
            var memnun = toplamOy ? Math.round((m.begeni / toplamOy) * 100) : null;
            $("list").innerHTML =
              _kart(
                "👥 Kullanıcılar",
                "<div>Toplam kayıtlı: " + _sayi(k.toplam) + "</div>" +
                  "<div>Son 7 gün yeni: " + _sayi(k.yeni7) + "</div>" +
                  "<div>Son 30 gün yeni: " + _sayi(k.yeni30) + "</div>" +
                  "<div>PRO (Firestore): " + _sayi(s.pro) + "</div>" +
                  '<div style="font-size:12px;color:#888;margin-top:6px">⚠️ PRO sayısı yalnız Firestore ayağını sayar; RevenueCat üzerinden gelen abonelikler burada görünmeyebilir.</div>' +
                  (k.kesildi ? '<div style="font-size:12px;color:#c0392b">⚠️ 20.000 üstü — sayım kesildi.</div>' : ""),
              ) +
              _kart(
                "🚪 Odalar",
                "<div>Bugün açılan: " + _sayi(o.bugun) + _fark(o.bugun, o.dun) + "</div>" +
                  "<div>Şu an açık: " + _sayi(o.acik) + "</div>" +
                  "<div>Toplam: " + _sayi(o.toplam) + "</div>",
              ) +
              _kart(
                "🤖 Merci AI",
                "<div>Bugün mesaj: " + _sayi(ai.mesajBugun) + "</div>" +
                  "<div>Bugün kullanan kişi: " + _sayi(ai.kisiBugun) + "</div>" +
                  "<div>👍 " + _sayi(m.begeni) + " · 👎 " + _sayi(m.begenmeme) +
                  (memnun !== null ? " · memnuniyet <b>%" + memnun + "</b>" : "") + "</div>",
              ) +
              _kart(
                "🎲 Kararlar",
                "<div>Bugün kaydedilen: " + _sayi(s.kararBugun) + "</div>" +
                  '<div style="font-size:12px;color:#888;margin-top:6px">⚠️ ' + esc(s.kararNot || "") +
                  " — ücretsiz kullanıcıların geçmişi yalnız kendi cihazlarında tutuluyor, bu sayı gerçek kullanımdan DÜŞÜKTÜR.</div>",
              ) +
              _kart(
                "📮 Gelen kutusu",
                "<div>Bize Ulaşın + Puanlama: " + _sayi(s.ulasin) + " kayıt</div>",
              ) +
              _kart(
                "🩺 Kota",
                '<div>Firestore kota kullanımı buradan OKUNAMAZ — Firebase o sayıyı API ile vermiyor.</div>' +
                  '<div style="margin-top:6px"><a href="https://console.firebase.google.com/project/_/usage" target="_blank" rel="noopener">Firebase Console → Usage</a> sayfasından bak.</div>' +
                  '<div style="font-size:12px;color:#888;margin-top:6px">⚠️ Spark tavanı 50K okuma/gün. 17 Tem 2026\'da bu tavan dolunca uygulama komple durmuştu. TomTom ve sunucu durumu için 🩺 Sağlık sekmesine bak.</div>',
              ) +
              '<div class="empty" style="margin-top:4px">' +
              (s.onbellek ? "↻ Önbellekten (60 sn)" : "✓ Taze veri") +
              " · " + new Date(s.zaman).toLocaleString("tr-TR") + "</div>";
          })
          .catch(function (e) {
            $("list").innerHTML = '<div class="empty">Özet okunamadı: ' + esc(e.message) + "</div>";
          });
      }

      // ══════════════════════════════════════════════════════════════════════
      // 🔍 KULLANICI — destek yazışması için tek kullanıcı araması
      // ══════════════════════════════════════════════════════════════════════
      // Firestore'da LİSTE taraması YOK: e-posta/UID ile tek kayıt çekilir.
      function loadKullanici() {
        $("toolbar").innerHTML = "";
        $("list").innerHTML =
          '<div class="card"><h3 style="margin:0 0 10px">🔍 Kullanıcı ara</h3>' +
          '<div class="row" style="gap:8px;flex-wrap:wrap">' +
          '<input id="uq" placeholder="e-posta veya UID" style="flex:1;min-width:220px;padding:9px;border:1px solid #ddd;border-radius:8px">' +
          '<button class="btn sm" onclick="userAra()">Ara</button></div>' +
          '<div style="font-size:12px;color:#888;margin-top:8px">E-posta tam yazılmalı (Firebase kısmi arama desteklemez).</div></div>' +
          '<div id="usonuc"></div>';
        var i = $("uq");
        if (i) i.addEventListener("keydown", function (e) { if (e.key === "Enter") window.userAra(); });
      }
      window.userAra = function () {
        var q = ($("uq").value || "").trim();
        if (!q) return;
        $("usonuc").innerHTML = '<div class="empty">Aranıyor…</div>';
        _get("/admin/user?q=" + encodeURIComponent(q))
          .then(function (u) {
            var proMetin = u.pro
              ? "🟢 PRO" + (u.proBitis ? " (bitiş " + new Date(u.proBitis).toLocaleDateString("tr-TR") + ")" : " (süresiz)")
              : "⚪ Ücretsiz";
            $("usonuc").innerHTML =
              '<div class="card"><h3 style="margin:0 0 10px">' + esc(u.email || u.uid) + "</h3>" +
              '<div class="uidbox" style="margin-bottom:8px">' + esc(u.uid) + "</div>" +
              "<div>Durum: <b>" + proMetin + "</b>" + (u.banli ? ' · <span style="color:#c0392b">🚫 BANLI</span>' : "") +
              (u.devreDisi ? ' · <span style="color:#c0392b">hesap devre dışı</span>' : "") + "</div>" +
              "<div>Kayıt: " + (u.olusturma ? new Date(u.olusturma).toLocaleString("tr-TR") : "—") + "</div>" +
              "<div>Son giriş: " + (u.sonGiris ? new Date(u.sonGiris).toLocaleString("tr-TR") : "—") + "</div>" +
              "<div>Giriş yöntemi: " + esc((u.saglayici || []).join(", ") || "—") + "</div>" +
              "<div>Kayıtlı karar: " + _sayi(u.kararSayisi) + "</div>" +
              '<div style="font-size:12px;color:#888">⚠️ Ücretsiz kullanıcıların kararları 16 Ağu\'dan beri sunucuya yazılmıyor → bu sayı düşük görünebilir.</div>' +
              '<div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap">' +
              '<button class="btn sm" onclick="proHediye(\'' + u.uid + '\',30)">🎁 30 gün PRO</button>' +
              '<button class="btn sm" onclick="proHediye(\'' + u.uid + '\',365)">🎁 1 yıl PRO</button>' +
              '<button class="btn ghost sm" onclick="proKapat(\'' + u.uid + '\')">PRO kaldır</button>' +
              banBtn(u.uid) +
              "</div></div>";
          })
          .catch(function (e) {
            $("usonuc").innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
          });
      };
      window.proHediye = function (uid, gun) {
        if (!confirm(uid + "\n\n" + gun + " günlük PRO verilsin mi?")) return;
        _post("/admin/gift-pro", { uid: uid, gun: gun })
          .then(function () { alert("✅ PRO verildi."); window.userAra(); })
          .catch(function (e) { alert("Hata: " + e.message); });
      };
      window.proKapat = function (uid) {
        if (!confirm(uid + "\n\nPRO hakkı kaldırılsın mı?")) return;
        _post("/admin/gift-pro", { uid: uid, kapat: true })
          .then(function () { alert("PRO kaldırıldı."); window.userAra(); })
          .catch(function (e) { alert("Hata: " + e.message); });
      };

      // ══════════════════════════════════════════════════════════════════════
      // 📣 DUYURU — uygulamanın üstünde çıkan şerit
      // ══════════════════════════════════════════════════════════════════════
      // ⚠️ KOTA: duyuru Firestore'da DEĞİL, sunucu belleğinde tutuluyor ve
      // GET /announce ile dağıtılıyor. Firestore'da tutulsaydı her kullanıcı
      // her açılışta 1 okuma yapardı (duyuru yokken bile).
      // ⚠️ Bedeli: sunucu yeniden başlarsa duyuru düşer.
      function loadDuyuru() {
        $("toolbar").innerHTML = "";
        fetch("/announce", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            $("list").innerHTML =
              '<div class="card"><h3 style="margin:0 0 10px">📣 Uygulama içi duyuru</h3>' +
              "<div>Şu anki durum: " +
              (d.var
                ? '<b style="color:#1a9c5b">YAYINDA</b> — "' + esc(d.metin) + '"' +
                  (d.bitis ? " (bitiş " + new Date(d.bitis).toLocaleString("tr-TR") + ")" : " (süresiz)")
                : "<b>yayında duyuru yok</b>") +
              "</div>" +
              '<div style="margin-top:12px"><input id="dmetin" maxlength="200" placeholder="Duyuru metni (en fazla 200 karakter)" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:8px" value="' +
              esc(d.metin || "") + '"></div>' +
              '<div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap">' +
              '<select id="dtur" style="padding:9px;border:1px solid #ddd;border-radius:8px">' +
              '<option value="bilgi">ℹ️ Bilgi</option><option value="uyari">⚠️ Uyarı</option><option value="bakim">🛠️ Bakım</option></select>' +
              '<input id="dsaat" type="number" min="0" max="720" value="24" style="width:110px;padding:9px;border:1px solid #ddd;border-radius:8px" placeholder="saat">' +
              '<span style="align-self:center;font-size:12px;color:#888">saat sonra kendiliğinden kalkar (0 = süresiz)</span></div>' +
              '<div class="row" style="gap:8px;margin-top:12px">' +
              '<button class="btn sm" onclick="duyuruYayinla()">Yayınla</button>' +
              '<button class="btn ghost sm" onclick="duyuruKaldir()">Kaldır</button></div>' +
              '<div style="font-size:12px;color:#888;margin-top:10px">⚠️ Sunucu yeniden başlarsa duyuru düşer (bellekte tutuluyor — Firestore okuma kotası yakmamak için).</div></div>';
          })
          .catch(function (e) {
            $("list").innerHTML = '<div class="empty">Okunamadı: ' + esc(e.message) + "</div>";
          });
      }
      window.duyuruYayinla = function () {
        var metin = ($("dmetin").value || "").trim();
        if (!metin) { alert("Metin boş."); return; }
        if (!confirm('"' + metin + '"\n\nBu yazı UYGULAMAYI AÇAN HERKESE görünecek. Emin misin?')) return;
        _post("/admin/announce", { metin: metin, tur: $("dtur").value, saat: +$("dsaat").value })
          .then(function () { alert("✅ Yayınlandı."); loadDuyuru(); })
          .catch(function (e) { alert("Hata: " + e.message); });
      };
      window.duyuruKaldir = function () {
        if (!confirm("Duyuru kaldırılsın mı?")) return;
        _post("/admin/announce", { metin: "", saat: 0 })
          .then(function () { loadDuyuru(); })
          .catch(function (e) { alert("Hata: " + e.message); });
      };

      // ── 🧪 YALNIZ BANA TEST ──────────────────────────────────────────────
      // Yanlış bildirimi binlerce kişiye göndermenin geri dönüşü yok. Bu buton
      // aynı metni `user_<adminUid>` topic'ine yollar; live-index.html'de her
      // girişli kullanıcı kendi `user_<UID>` topic'ine abone oluyor.
      window.pushTestBana = function () {
        var title = $("pt").value.trim(), body = $("pb").value.trim();
        if (!title || !body) { alert("Başlık ve metin zorunlu."); return; }
        var me = auth.currentUser && auth.currentUser.uid;
        if (!me) { alert("Oturum yok."); return; }
        _post("/admin/push", {
          title: title, body: body, url: $("pu").value.trim(), topic: "user_" + me,
        })
          .then(function () { alert("🧪 Test gönderildi — yalnız senin cihazına."); })
          .catch(function (e) { alert("Hata: " + e.message); });
      };

      // ── 📋 ŞABLONLAR (localStorage — Firestore'a dokunmaz) ───────────────
      function sablonOku() {
        try { return JSON.parse(localStorage.getItem("kmPushSablon") || "[]"); }
        catch (e) { return []; }
      }
      function sablonlariCiz() {
        var arr = sablonOku(), el = $("sablonlar");
        if (!el) return;
        if (!arr.length) { el.innerHTML = '<div class="empty" style="margin:0">Kayıtlı şablon yok.</div>'; return; }
        el.innerHTML = arr.map(function (s, i) {
          return '<div class="row" style="gap:8px;margin-bottom:6px">' +
            '<button class="btn ghost sm" style="flex:1;text-align:left" onclick="sablonYukle(' + i + ')">' +
            esc(s.t) + ' <span style="color:#888">— ' + esc((s.b || "").slice(0, 40)) + '</span></button>' +
            '<button class="btn ghost sm" onclick="sablonSil(' + i + ')">🗑</button></div>';
        }).join("");
      }
      window.sablonYukle = function (i) {
        var s = sablonOku()[i]; if (!s) return;
        $("pt").value = s.t || ""; $("pb").value = s.b || ""; $("pu").value = s.u || "";
      };
      window.sablonKaydet = function () {
        var t = $("pt").value.trim(), b = $("pb").value.trim();
        if (!t || !b) { alert("Önce başlık ve metni doldur."); return; }
        var arr = sablonOku();
        arr.unshift({ t: t, b: b, u: $("pu").value.trim() });
        try { localStorage.setItem("kmPushSablon", JSON.stringify(arr.slice(0, 20))); } catch (e) {}
        sablonlariCiz();
      };
      window.sablonSil = function (i) {
        var arr = sablonOku(); arr.splice(i, 1);
        try { localStorage.setItem("kmPushSablon", JSON.stringify(arr)); } catch (e) {}
        sablonlariCiz();
      };

      window.pushSendNow = function () {
        var title = $("pt").value.trim();
        var body = $("pb").value.trim();
        var url = $("pu").value.trim();
        var topic = $("ptopic").value.trim() || "tum-kullanicilar";
        if (!title || !body) { alert("Başlık ve metin zorunlu."); return; }
        if (!confirm('"' + title + '"\n\nBu bildirim ' + topic + ' abonelerine GİDECEK. Emin misin?')) return;
        var b = $("pbtn"); b.disabled = true; b.textContent = "Gönderiliyor…";
        _post("/admin/push", { title: title, body: body, url: url, topic: topic })
          .then(function () { alert("Gönderildi ✅"); $("pt").value = ""; $("pb").value = ""; $("pu").value = ""; loadPush(); })
          .catch(function (e) { alert("Hata: " + e.message); })
          .then(function () { b.disabled = false; b.textContent = "📤 Şimdi Gönder"; });
      };

      window.pushSchedule = function () {
        var title = $("st").value.trim();
        var body = $("sb").value.trim();
        var url = $("su").value.trim();
        var mode = $("smode").value;
        var hour = parseInt($("sh").value, 10) || 0;
        var minute = parseInt($("sm").value, 10) || 0;
        var weekday = parseInt($("swd").value, 10) || 0;
        if (!title || !body) { alert("Başlık ve metin zorunlu."); return; }
        _post("/admin/push/schedule", {
          title: title, body: body, url: url, mode: mode,
          hour: hour, minute: minute, weekday: weekday, active: true,
        })
          .then(function (j) {
            alert("Kaydedildi ✅\nİlk gönderim: " + new Date(j.nextAt).toLocaleString("tr-TR"));
            $("st").value = ""; $("sb").value = ""; $("su").value = "";
            loadPush();
          })
          .catch(function (e) { alert("Hata: " + e.message); });
      };

      // Listelenen zamanlanmış kayıtların ham verisi (toggle sunucuya geri gönderiyor).
      var _schedCache = {};

      // ⚠️ HATA DÜZELTMESİ (2 Ağu): Eskiden bu fonksiyon SADECE `active` alanını
      // çeviriyordu. Sonuç: bir bildirimi durdurup GÜNLER SONRA başlatınca `nextAt`
      // geçmişte kalmış oluyordu → zamanlayıcının `nextAt <= now` sorgusu onu
      // "vakti gelmiş" sayıp O DAKİKA gönderiyordu. Yani "Başlat" tuşu beklenmedik
      // bir anda tüm kullanıcılara bildirim atabiliyordu.
      // ÇÖZÜM: Başlatma da sunucu ucundan geçiyor; sunucu `nextAt`i BİR SONRAKİ
      // uygun vakte YENİDEN HESAPLIYOR. Durdurma zararsız olduğu için doğrudan yazılır.
      window.pushToggle = function (id, active) {
        if (active) {
          // Durduruyoruz: nextAt'e dokunmaya gerek yok (sorguya zaten girmez).
          db.collection("pushSchedule").doc(id).set({ active: false }, { merge: true })
            .then(loadPush)
            .catch(function (e) { alert("Hata: " + e.message); });
          return;
        }
        var s = _schedCache[id];
        if (!s) { alert("Kayıt okunamadı, sayfayı yenile."); return; }
        _post("/admin/push/schedule", {
          id: id,
          title: s.title, body: s.body, url: s.url || "", topic: s.topic,
          mode: s.mode, hour: s.hour, minute: s.minute, weekday: s.weekday,
          active: true,
        })
          .then(function (j) {
            alert("Başlatıldı ✅\nİlk gönderim: " + new Date(j.nextAt).toLocaleString("tr-TR"));
            loadPush();
          })
          .catch(function (e) { alert("Hata: " + e.message); });
      };
      window.pushDelete = function (id) {
        if (!confirm("Bu zamanlanmış bildirim silinsin mi?")) return;
        db.collection("pushSchedule").doc(id).delete().then(loadPush)
          .catch(function (e) { alert("Hata: " + e.message); });
      };

      function loadPush() {
        $("toolbar").innerHTML = "";
        var days = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
        var dayOpts = days.map(function (d, i) { return '<option value="' + i + '">' + d + "</option>"; }).join("");
        var html =
          '<div class="card"><h3 style="margin:0 0 10px">📤 Hemen Gönder</h3>' +
          '<input id="pt" placeholder="Başlık (ör. Akşam ne yesek? 🍽️)" style="width:100%;padding:9px;margin-bottom:6px">' +
          '<input id="pb" placeholder="Metin" style="width:100%;padding:9px;margin-bottom:6px">' +
          '<input id="pu" placeholder="Link — BOŞ BIRAK (dolu olursa tarayıcı açılır)" style="width:100%;padding:9px;margin-bottom:2px">' +
          '<div style="font-size:12px;color:#888;margin-bottom:8px">Boşsa bildirime dokununca <b>uygulama</b> açılır. URL yazarsan uygulama yerine <b>harici tarayıcıda</b> o adres açılır (sponsorlu içerik / kampanya sayfası için).</div>' +
          '<div style="font-size:12px;font-weight:800;color:#555;margin-bottom:4px">Hedef kitle (topic)</div>' +
          '<input id="ptopic" value="tum-kullanicilar" style="width:100%;padding:9px;margin-bottom:2px">' +
          '<div style="font-size:12px;color:#888;margin-bottom:8px"><b>tum-kullanicilar</b> = bildirime izin veren herkes. 🧪 test butonu bu alanı <b>yok sayar</b>, her zaman yalnız sana gönderir.</div>' +
          '<div class="row" style="gap:8px;flex-wrap:wrap">' +
          '<button class="btn" id="pbtn" onclick="pushSendNow()">📤 Şimdi Gönder</button>' +
          '<button class="btn ghost sm" onclick="pushTestBana()">🧪 Yalnız bana test gönder</button>' +
          "</div>" +
          '<div style="font-size:12px;color:#888;margin-top:6px">⚠️ Geri alınamaz. Yalnız uygulamayı kurup bildirime izin verenlere gider.<br>🧪 Test, <b>user_&lt;senin UID&gt;</b> topic\'ine gider — yalnız kendi cihazına düşer. Görmek için uygulamada bu hesapla giriş yapmış ve bildirime izin vermiş olmalısın.</div></div>' +

          '<div class="card"><h3 style="margin:0 0 10px">📋 Şablonlar</h3>' +
          '<div id="sablonlar"></div>' +
          '<div class="row" style="gap:8px;margin-top:10px">' +
          '<button class="btn ghost sm" onclick="sablonKaydet()">💾 Üstteki metni şablon olarak kaydet</button></div>' +
          '<div style="font-size:12px;color:#888;margin-top:6px">Şablonlar bu tarayıcıda saklanır (Firestore kotası yakmaz).</div></div>' +

          '<div class="card"><h3 style="margin:0 0 10px">⏰ Zamanla</h3>' +
          '<input id="st" placeholder="Başlık" style="width:100%;padding:9px;margin-bottom:6px">' +
          '<input id="sb" placeholder="Metin" style="width:100%;padding:9px;margin-bottom:6px">' +
          '<input id="su" placeholder="Link (opsiyonel)" style="width:100%;padding:9px;margin-bottom:6px">' +
          '<div class="row" style="gap:6px;margin-bottom:8px">' +
          '<select id="smode" style="padding:9px"><option value="daily">Her gün</option><option value="weekly">Haftalık</option><option value="once">Tek sefer</option></select>' +
          '<select id="swd" style="padding:9px">' + dayOpts + "</select>" +
          '<input id="sh" type="number" min="0" max="23" value="18" style="width:64px;padding:9px" title="Saat (TR)">' +
          '<input id="sm" type="number" min="0" max="59" value="0" style="width:64px;padding:9px" title="Dakika">' +
          "</div>" +
          '<button class="btn" onclick="pushSchedule()">💾 Kaydet</button>' +
          '<div style="font-size:12px;color:#888;margin-top:6px">Saatler <b>Türkiye saati</b>. Haftalık seçilmezse gün alanı yok sayılır.</div></div>' +
          '<div id="plist"><div class="empty">Yükleniyor…</div></div>';
        $("list").innerHTML = html;
        sablonlariCiz();

        // Zamanlanmışlar + son gönderilenler
        db.collection("pushSchedule").limit(50).get().then(function (snap) {
          var out = '<div class="card"><h3 style="margin:0 0 10px">⏰ Zamanlanmışlar (' + snap.size + ")</h3>";
          if (!snap.size) out += '<div class="empty">Henüz zamanlanmış bildirim yok.</div>';
          _schedCache = {};
          snap.forEach(function (d) {
            var x = d.data() || {};
            _schedCache[d.id] = x; // pushToggle sunucuya geri göndermek için kullanır
            var when =
              x.mode === "weekly" ? days[x.weekday || 0] + " " : x.mode === "once" ? "Tek sefer " : "Her gün ";
            when += String(x.hour || 0).padStart(2, "0") + ":" + String(x.minute || 0).padStart(2, "0");
            out +=
              '<div style="border-top:1px solid #eee;padding:8px 0">' +
              "<b>" + esc(x.title || "") + "</b> — " + esc(x.body || "") +
              '<div style="font-size:12px;color:#888;margin-top:3px">' + when +
              " · " + (x.active ? "🟢 aktif" : "⚪ kapalı") +
              " · gönderim: " + (x.sentCount || 0) +
              (x.nextAt && x.nextAt.toDate ? " · sıradaki: " + x.nextAt.toDate().toLocaleString("tr-TR") : "") +
              "</div>" +
              '<div class="row" style="margin-top:6px">' +
              '<button class="btn sm" onclick="pushToggle(\'' + d.id + "'," + (x.active ? "true" : "false") + ')">' +
              (x.active ? "⏸ Durdur" : "▶️ Başlat") + "</button>" +
              '<button class="btn danger sm" onclick="pushDelete(\'' + d.id + '\')">🗑 Sil</button>' +
              "</div></div>";
          });
          out += "</div>";
          return db.collection("pushLog").orderBy("at", "desc").limit(20).get().then(function (ls) {
            out += '<div class="card"><h3 style="margin:0 0 10px">📜 Son Gönderilenler</h3>';
            if (!ls.size) out += '<div class="empty">Henüz gönderim yok.</div>';
            ls.forEach(function (d) {
              var x = d.data() || {};
              out +=
                '<div style="border-top:1px solid #eee;padding:7px 0">' +
                (x.ok === false ? "❌ " : "✅ ") + "<b>" + esc(x.title || "") + "</b>" +
                '<div style="font-size:12px;color:#888">' + esc(x.topic || "") + " · " + esc(x.by || "") +
                (x.at && x.at.toDate ? " · " + x.at.toDate().toLocaleString("tr-TR") : "") +
                (x.err ? " · " + esc(x.err) : "") + "</div></div>";
            });
            out += "</div>";
            $("plist").innerHTML = out;
            $("cnt-push").textContent = snap.size;
          });
        }).catch(function (e) {
          $("plist").innerHTML = '<div class="empty">Okunamadı: ' + esc(e.message) +
            "<br><small>pushSchedule/pushLog için Firestore kuralları eklenmiş mi?</small></div>";
        });
      }

      // ── 🩺 SAĞLIK: /version çıktısını panelde göster ──────────────────────
      // Böylece sunucu sürümü, bayraklar ve TomTom sayaçları için curl'e ya da
      // Claude'a sormaya gerek kalmaz.
      function loadHealth() {
        $("toolbar").innerHTML = "";
        fetch("/version", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (v) {
            var t = v.tomtom || {};
            var f = v.flags || {};
            var bad = function (b) { return b ? "🟢" : "🔴"; };
            $("list").innerHTML =
              '<div class="card"><h3 style="margin:0 0 10px">🩺 Sunucu</h3>' +
              "<div>Sürüm: <b>" + (v.server && v.server.bytes) + "</b> byte</div>" +
              "<div>index.html: " + (v.index && v.index.bytes) + " byte</div>" +
              "<div>Başlatma: " + new Date(v.bootedAt).toLocaleString("tr-TR") +
              " (" + Math.round((v.uptimeSec || 0) / 60) + " dk)</div>" +
              "<div>Node: " + esc(v.node || "") + "</div></div>" +
              '<div class="card"><h3 style="margin:0 0 10px">🚩 Bayraklar</h3>' +
              "<div>Mekan sağlayıcı: <b>" + esc(f.places || "") + "</b></div>" +
              "<div>" + bad(f.tomtomKey) + " TomTom anahtarı</div>" +
              "<div>" + bad(f.toolUse) + " Tool use</div>" +
              "<div>" + bad(f.anthropicKey) + " Anthropic anahtarı</div>" +
              "<div>" + bad(f.firebase) + " Firebase</div></div>" +
              '<div class="card"><h3 style="margin:0 0 10px">💰 TomTom Kullanımı</h3>' +
              "<div>Bu ay ücretli çağrı: <b>" + (t.attempts || 0) + "</b> (tavan 4500)</div>" +
              "<div>Önbellekten karşılanan: " + (t.cacheHit || 0) + " · başarılı: " + (t.ok || 0) + "</div>" +
              "<div>Süzülen: " + (t.filtered || 0) + " · boş: " + (t.empty || 0) + "</div>" +
              "<div>HTTP hata: " + (t.httpErr || 0) + " (son kod " + (t.lastStatus || 0) + ") · ağ hata: " + (t.netErr || 0) + "</div>" +
              "<div>Tavan doldu: " + (t.capped || 0) + " · son süre: " + (t.lastMs || 0) + " ms</div>" +
              '<div style="font-size:12px;color:#888;margin-top:6px">⚠️ Sayaçlar sunucu yeniden başlayınca sıfırlanır (aylık bütçe Firestore\'da tutulur).</div></div>';
            $("cnt-saglik").textContent = f.tomtomKey ? "🟢" : "🔴";
          })
          .catch(function (e) {
            $("list").innerHTML = '<div class="empty">/version okunamadı: ' + esc(e.message) + "</div>";
          });
      }

      // ── Ban altyapısı (bans/{uid}) ──
      var bansCache = {}; // uid -> ban dokümanı
      function refreshBans() {
        return db.collection("bans").limit(500).get().then(function (snap) {
          bansCache = {};
          snap.forEach(function (d) { bansCache[d.id] = d.data() || {}; });
        }).catch(function () { /* ban okunamazsa boş kabul et */ });
      }
      function banBtn(uid) {
        if (!uid) return "";
        if (bansCache[uid]) {
          return '<button class="btn ghost sm" style="border-color:var(--red);color:var(--red)" onclick="unbanUser(\'' +
            uid + '\')">✅ Banı Kaldır</button>';
        }
        return '<button class="btn danger sm" onclick="banUser(\'' + uid + '\')">🚫 Banla</button>';
      }
      window.banUser = function (uid) {
        if (!uid) { alert("Bu kaydın uid'i yok (anonim) — banlanamaz."); return; }
        var reason = prompt("Ban sebebi (opsiyonel, kullanıcıya gösterilir):", "kötüye kullanım");
        if (reason === null) return;
        db.collection("bans").doc(uid).set({
          reason: reason || "",
          at: firebase.firestore.FieldValue.serverTimestamp(),
          by: (auth.currentUser && auth.currentUser.email) || "admin",
        }).then(refreshBans).then(function () { switchTab(currentTab); })
          .catch(function (e) { alert("Ban başarısız: " + e.message); });
      };
      window.unbanUser = function (uid) {
        if (!confirm(uid + "\niçin ban kaldırılsın mı?")) return;
        db.collection("bans").doc(uid).delete()
          .then(refreshBans).then(function () { switchTab(currentTab); })
          .catch(function (e) { alert("Ban kaldırılamadı: " + e.message); });
      };

      // ── AI Kota (aiUsage: uid başına toplam istek) ──
      function loadUsage() {
        db.collection("aiUsage").limit(1000).get().then(function (snap) {
          var byUid = {};
          snap.forEach(function (d) {
            var x = d.data(); var u = x.uid || "?";
            if (!byUid[u]) byUid[u] = { uid: u, total: 0, days: 0, last: "" };
            byUid[u].total += x.count || 0;
            byUid[u].days += 1;
            if ((x.date || "") > byUid[u].last) byUid[u].last = x.date || "";
          });
          var arr = Object.keys(byUid).map(function (k) { return byUid[k]; });
          arr.sort(function (a, b) { return b.total - a.total; });
          $("cnt-kota").textContent = arr.length;
          if (!arr.length) { $("list").innerHTML = '<div class="empty">Kayıt yok.</div>'; return; }
          $("list").innerHTML = arr.map(function (u) {
            var banned = !!bansCache[u.uid];
            var lvl = u.total >= 50 ? "red" : u.total >= 20 ? "amber" : "gray";
            return '<div class="card"><div class="meta">' +
              '<span class="pill ' + lvl + '">' + u.total + ' istek</span>' +
              "<span>" + u.days + " gün</span>" +
              "<span>· son: " + esc(u.last || "—") + "</span>" +
              (banned ? '<span class="pill red">🚫 BANLI</span>' : "") +
              "</div>" +
              '<div class="body" style="font-family:monospace;font-size:12px;color:var(--mut);word-break:break-all">' +
              esc(u.uid) + "</div>" +
              '<div class="row" style="margin-top:10px;margin-bottom:0">' + banBtn(u.uid) + "</div>" +
              "</div>";
          }).join("");
        }).catch(renderErr);
      }

      function renderErr(e) {
        var msg = e && e.code === "permission-denied"
          ? "Erişim reddedildi. Bu koleksiyon okuması yalnız kilitli admin UID'ine açık — panel kilitlenip Firestore kuralları güncellenince görünecek."
          : "Hata: " + esc(e && e.message);
        $("list").innerHTML = '<div class="err">' + msg + "</div>";
      }

      // ── Bize Ulaşın + Puanlama (ikisi de feedback koleksiyonu) ──
      // ⚠️ KOTA: 300 → 150. Sayaçlar bu 150'yi yansıtır; GERÇEK toplam 📈 Özet
      // sekmesinde (aggregation ile, doküman indirmeden).
      // ⚠️ d.id de alınıyor — "okundu" işareti için doküman kimliği gerekiyor.
      var sonKayitlar = [];
      function loadFeedback(kind) {
        db.collection("feedback").orderBy("ts", "desc").limit(150).get().then(function (snap) {
          var docs = [];
          snap.forEach(function (d) {
            var o = d.data();
            o._id = d.id;
            docs.push(o);
          });
          sonKayitlar = docs;
          // rating alanı VARSA puanlama, YOKSA iletişim
          var contact = docs.filter(function (x) { return x.rating == null; });
          var rating = docs.filter(function (x) { return x.rating != null; });
          $("cnt-ulasin").textContent = contact.length;
          $("cnt-puan").textContent = rating.length;
          var arr = kind === "rating" ? rating : contact;
          arr.sort(function (a, b) { return tsVal(b.ts) - tsVal(a.ts); });
          if (!arr.length) {
            $("list").innerHTML = '<div class="empty">Kayıt yok.</div>';
            return;
          }
          var konuMap = {
            hata: '<span class="pill amber">🐛 Hata</span>',
            oneri: '<span class="pill">💡 Öneri</span>',
            sikayet: '<span class="pill red">😕 Şikayet</span>',
            diger: '<span class="pill gray">💬 Diğer</span>',
          };
          var html = arr.map(function (x) {
            if (kind === "rating") {
              var n = Math.max(0, Math.min(5, x.rating | 0));
              return (
                '<div class="card"><div class="meta">' +
                '<span class="stars">' + "★".repeat(n) + "☆".repeat(5 - n) + "</span>" +
                '<span class="pill gray">' + x.rating + "/5</span>" +
                "<span>" + fmtTs(x.ts) + "</span></div>" +
                (x.text ? '<div class="body">' + esc(x.text) + "</div>" : '<div class="body" style="color:var(--mut)">(yorum yok)</div>') +
                "</div>"
              );
            }
            return (
              '<div class="card"' + (x.okundu ? ' style="opacity:.62"' : "") + '><div class="meta">' +
              (konuMap[x.konu] || '<span class="pill gray">' + esc(x.konu || "?") + "</span>") +
              "<span>" + fmtTs(x.ts) + "</span>" +
              (x.email ? '<span>· <a href="mailto:' + esc(x.email) + '">' + esc(x.email) + "</a></span>" : "<span>· e-posta yok</span>") +
              (x.okundu ? '<span class="pill green">✅ okundu</span>' : "") +
              "</div>" +
              '<div class="body">' + esc(x.mesaj) + "</div>" +
              '<div class="row" style="margin:10px 0 0">' +
              '<button class="btn ghost sm" onclick="okunduIsaretle(\'' + x._id + '\',' + (x.okundu ? "false" : "true") + ')">' +
              (x.okundu ? "↩︎ Okunmadı yap" : "✅ Okundu işaretle") + "</button>" +
              (x.email
                ? '<a class="btn ghost sm" style="text-decoration:none" href="mailto:' + esc(x.email) +
                  "?subject=" + encodeURIComponent("Karar Mercii - mesajınız hakkında") + '">✉️ Yanıtla</a>'
                : "") +
              "</div></div>"
            );
          }).join("");
          var arac =
            '<div class="row" style="gap:8px;margin-bottom:10px">' +
            '<button class="btn ghost sm" onclick="csvIndir(\'' + kind + '\')">📤 CSV indir</button>' +
            '<span style="align-self:center;font-size:12px;color:#888">son 150 kayıt · gerçek toplam 📈 Özet\'te</span></div>';
          $("list").innerHTML = arac + html;
        }).catch(renderErr);
      }
      // ⚠️ Firestore kuralı: feedback update YALNIZ admin'e açık (allow update:
      // if isAdmin()). Kural güncellenmeden bu buton "permission denied" verir.
      window.okunduIsaretle = function (id, deger) {
        db.collection("feedback").doc(id).set({ okundu: deger }, { merge: true })
          .then(function () { loadFeedback(currentTab === "puan" ? "rating" : "contact"); })
          .catch(function (e) {
            alert("Yazılamadı: " + e.message + "\n\nFirestore kuralında feedback update admin'e açık mı?");
          });
      };
      // CSV: ekrandaki kayıtlardan üretilir, YENİ Firestore okuması YAPMAZ.
      window.csvIndir = function (kind) {
        var arr = sonKayitlar.filter(function (x) {
          return kind === "rating" ? x.rating != null : x.rating == null;
        });
        var satir = function (a) {
          return a.map(function (v) {
            return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
          }).join(",");
        };
        var csv = [satir(["tarih", "tur", "puan", "konu", "eposta", "mesaj", "okundu"])];
        arr.forEach(function (x) {
          csv.push(satir([
            fmtTs(x.ts), kind === "rating" ? "puanlama" : "iletisim",
            x.rating == null ? "" : x.rating, x.konu || "",
            x.email || "", x.text || x.mesaj || "", x.okundu ? "evet" : "hayir",
          ]));
        });
        // ﻿ = BOM → Excel Türkçe karakterleri doğru açsın.
        var blob = new Blob(["﻿" + csv.join("\r\n")], { type: "text/csv;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "karar-mercii-" + kind + "-" + new Date().toISOString().slice(0, 10) + ".csv";
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      };

      // ── Merci AI feedback ──
      // ⚠️ KOTA: eskiden limit(300) ile 300 doküman çekilip JS'te sıralanıyordu.
      // Artık 60 kayıt + filtre. 👎 filtresi Merci'nin nerede saçmaladığını
      // görmenin en doğrudan yolu (soru + cevap yan yana duruyor).
      // ⚠️ where("vote") ile orderBy("ts") BİRLİKTE kullanılmıyor: ikisi farklı
      // alan olduğu için composite index isterdi ve indeks yoksa sorgu HATA
      // verirdi. Filtreliyken sıralama JS'te yapılıyor (60 kayıt, ucuz).
      var merciFiltre = "hepsi";
      window.merciFiltreSec = function (f) { merciFiltre = f; loadMerci(); };
      function loadMerci() {
        var q = db.collection("merci_feedback");
        q = merciFiltre === "hepsi"
          ? q.orderBy("ts", "desc").limit(60)
          : q.where("vote", "==", merciFiltre).limit(60);
        q.get().then(function (snap) {
          var arr = [];
          snap.forEach(function (d) { arr.push(d.data()); });
          $("cnt-merci").textContent = arr.length;
          arr.sort(function (a, b) { return tsVal(b.ts) - tsVal(a.ts); });
          var btn = function (f, etiket) {
            return '<button class="btn ' + (merciFiltre === f ? "" : "ghost ") +
              'sm" onclick="merciFiltreSec(\'' + f + '\')">' + etiket + "</button>";
          };
          var head =
            '<div class="row" style="gap:8px">' + btn("hepsi", "Hepsi") +
            btn("dislike", "👎 Beğenilmeyenler") + btn("like", "👍 Beğenilenler") +
            '</div><div class="empty" style="margin:0 0 10px">Son ' + arr.length +
            " kayıt gösteriliyor · toplam sayılar 📈 Özet sekmesinde</div>";
          if (!arr.length) {
            $("list").innerHTML = head + '<div class="empty">Bu filtrede kayıt yok.</div>';
            return;
          }
          var html = arr.map(function (x) {
            var v = x.vote === "like"
              ? '<span class="pill green">👍 Beğendi</span>'
              : '<span class="pill red">👎 Beğenmedi</span>';
            var uid = x.uid || null;
            var banned = uid && bansCache[uid];
            return (
              '<div class="card"><div class="meta">' + v +
              "<span>" + fmtTs(x.ts) + "</span>" +
              (uid
                ? '<span class="pill gray">' + esc(uid.slice(0, 8)) + "…</span>"
                : '<span class="pill gray">anonim</span>') +
              (banned ? '<span class="pill red">🚫 BANLI</span>' : "") +
              "</div>" +
              (x.userMsg ? '<div class="body">Kullanıcı: ' + esc(x.userMsg) + "</div>" : "") +
              '<div class="quote">Merci: ' + esc(x.reply || "") + "</div>" +
              (uid ? '<div class="row" style="margin-top:10px;margin-bottom:0">' + banBtn(uid) + "</div>" : "") +
              "</div>"
            );
          }).join("");
          $("list").innerHTML = head + html;
        }).catch(renderErr);
      }

      // ── Odalar (açık odalar + kapat) ──
      function loadRooms() {
        db.collection("rooms").limit(400).get().then(function (snap) {
          var arr = [];
          snap.forEach(function (d) {
            var o = d.data(); o._id = d.id; arr.push(o);
          });
          var open = arr.filter(function (x) { return x.status === "open"; });
          $("cnt-oda").textContent = open.length;
          arr.sort(function (a, b) {
            var rank = function (s) { return s === "open" ? 0 : 1; };
            if (rank(a.status) !== rank(b.status)) return rank(a.status) - rank(b.status);
            return (b.created || 0) - (a.created || 0);
          });
          if (!arr.length) {
            $("list").innerHTML = '<div class="empty">Oda yok.</div>';
            return;
          }
          var head = open.length
            ? '<div class="row" style="margin-bottom:14px"><span class="pill green">' +
              open.length +
              ' açık oda</span><button class="btn danger sm" onclick="closeAllRooms()">🧹 Tüm Açık Odaları Kapat</button></div>'
            : "";
          $("list").innerHTML = head + arr.map(function (x) {
            var st = x.status === "open"
              ? '<span class="pill green">AÇIK</span>'
              : x.status === "closed"
              ? '<span class="pill gray">kapalı</span>'
              : '<span class="pill amber">' + esc(x.status || "?") + "</span>";
            var pc = x.participants ? Object.keys(x.participants).length : 0;
            var expired = x.closesAt && x.closesAt < Date.now();
            return (
              '<div class="card"><div class="meta">' +
              '<span class="pill">' + esc(x._id) + "</span>" + st +
              (expired && x.status === "open" ? '<span class="pill red">süresi geçmiş</span>' : "") +
              "<span>👥 " + pc + "</span>" +
              "<span>· " + fmtTs(x.created) + "</span></div>" +
              '<div class="body">' + esc(x.name || "(adsız)") +
              (x.options ? ' <span style="color:var(--mut)">— ' + esc((x.options || []).join(", ")) + "</span>" : "") +
              "</div>" +
              (x.status === "open"
                ? '<div class="row" style="margin-top:10px;margin-bottom:0"><button class="btn danger sm" onclick="closeRoom(\'' +
                  esc(x._id) + "')\">Odayı Kapat</button></div>"
                : "") +
              "</div>"
            );
          }).join("");
        }).catch(renderErr);
      }

      window.closeRoom = function (id) {
        if (!confirm(id + " odasını kapatmak istiyor musun?")) return;
        db.collection("rooms").doc(id).update({ status: "closed" })
          .then(function () { loadRooms(); })
          .catch(function (e) { alert("Kapatılamadı: " + e.message); });
      };

      // Tüm açık odaları toplu kapat (eski/closesAt'sız olanlar dahil).
      window.closeAllRooms = function () {
        db.collection("rooms").where("status", "==", "open").limit(500).get()
          .then(function (snap) {
            if (snap.empty) { alert("Açık oda yok."); return; }
            if (!confirm(snap.size + " açık oda kapatılsın mı? (Geri alınamaz)")) return;
            var batch = db.batch();
            snap.forEach(function (d) {
              // tieItems: options → izleyen bir client kalırsa çökmesin
              var o = d.data() || {};
              batch.update(d.ref, {
                status: "closed",
                tieItems: o.options || [],
                closedBy: "admin",
                closedAt: Date.now(),
              });
            });
            return batch.commit().then(function () {
              alert(snap.size + " oda kapatıldı.");
              loadRooms();
            });
          })
          .catch(function (e) { alert("Hata: " + e.message); });
      };
    </script>
  </body>
</html>
